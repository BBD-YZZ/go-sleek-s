# WebLogic Console 弱口令检测
#
# 使用笛卡尔积爆破检测 WebLogic 控制台弱口令
# username 来自 wordlists/weblogic-users.txt
# password 来自 wordlists/weblogic-pass.txt
id: weblogic-console-bypass
name: Oracle WebLogic Console 弱口令检测
description: |
  检测 Oracle WebLogic Server 管理控制台的弱口令漏洞。
  WebLogic 控制台是 Java 企业应用的核心管理界面，
  若使用弱口令，攻击者可直接部署恶意 WAR 包实现远程代码执行（RCE）。
  攻击路径：弱口令登录 → 部署恶意 WAR → Runtime MBean 执行命令 → RCE
severity: critical
author: gosleek
tags: [weblogic, rce, auth-bypass, default-password, cve, java]
reference:
  - https://.oracle.com/security-alerts/
  - https://cwe.mitre.org/data/definitions/798.html
  - https://nvd.nist.gov/vuln/detail/CVE-2014-4210
  - https://blogs.oracle.com/security/alert/cve-2017-10271-weblogic-rce

http:
  # 阶段1: 探测 WebLogic 控制台是否存在 (probe请求，只提取信息，不参与最终判定)
  - name: probe-console
    probe: true
    method: GET
    path:
      - /console/login/LoginForm.jsp
      - /console/
      - /consolejndi.portal
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words: ["WebLogic Server Management Console", "Welcome to the Administration Console", "j_username", "j_password"]
        condition: or
        case-insensitive: true
      - type: word
        part: header
        words: ["WebLogic"]
        case-insensitive: true
    extractors:
      - name: console-found
        type: word
        part: body
        words: ["WebLogic Server", "j_username", "Administration Console"]
        case-insensitive: true

  # 阶段2: 弱口令爆破（笛卡尔积: user × password）
  - name: brute-login
    run-if: "{{console-found}}"
    method: POST
    path: [/console/j_security_check]
    headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      Content-Type: application/x-www-form-urlencoded
    body: "j_username={{username}}&j_password={{password}}"
    wordlist:
      - key: username
        path: wordlists/weblogic-users.txt
      - key: password
        path: wordlists/weblogic-pass.txt
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 302]
      - type: word
        part: body
        words: ["Main", "Navigation", "Deployments", "Security", "WebLogic Server Console", "Welcome to the Administration Console"]
        condition: or
        case-insensitive: true
    extractors:
      - name: session-id
        type: regex
        part: header
        regex: ['"Set-Cookie":\s*"WEBLOGIC_CONSOLE=([^"]+)"']
        group: 1
