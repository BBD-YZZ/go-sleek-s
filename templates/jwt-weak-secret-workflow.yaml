id: jwt-weak-secret-workflow
name: "JWT Weak Secret Detection"
severity: "critical"
tags: [jwt, auth, token, weak-secret]
description: |
  检测 JWT 弱密钥漏洞。
  使用 workflow 确保顺序执行。

workflow:
  # 步骤1：提取 JWT token
  - name: "extract-token"
    http:
      - raw: |
          GET /api/auth HTTP/1.1
          Host: {{Hostname}}
        extractors:
          - name: "jwt_token"
            type: "regex"
            regex: ['"token"\s*:\s*"([^"]+)"']
          - name: "set_cookie"
            type: "cookie"
        matchers:
          - type: status
            status: [200]

  # 步骤2：测试弱密钥（依赖步骤1）
  - name: "test-weak-secret"
    requires: ["extract-token"]
    http:
      - raw: |
          GET /api/profile HTTP/1.1
          Host: {{Hostname}}
          Authorization: Bearer {{jwt_token}}
        matchers:
          - type: status
            status: [200]

  # 步骤3：尝试常见密钥（依赖步骤1）
  - name: "try-common-secrets"
    requires: ["extract-token"]
    http:
      - raw: |
          GET /api/verify HTTP/1.1
          Host: {{Hostname}}
        run-if: "len(jwt_token) > 0"
        range:
          key: "secret"
          values:
            - "secret"
            - "password"
            - "123456"
            - "jwt_secret"
            - "mysecret"
            - "changeme"
            - "test"
            - "key"
            - "admin"
            - "jwt"
        matchers:
          - type: status
            status: [200]
