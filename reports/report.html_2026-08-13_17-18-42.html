<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gosleek 扫描报告</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0f0f23; color: #e0e0e0; line-height: 1.6; padding: 2em; }
h1 { color: #00d4ff; font-size: 1.8em; margin-bottom: 0.5em; }
h2 { color: #7fdbca; font-size: 1.2em; margin: 1.5em 0 0.5em; }
p { color: #aaa; margin-bottom: 1em; }
table { border-collapse: collapse; width: 100%; margin-top: 1em; background: #1a1a2e; border-radius: 8px; overflow: hidden; }
th { background: #16213e; color: #00d4ff; font-weight: 600; text-align: left; padding: 12px 16px; border: none; }
td { padding: 12px 16px; border-bottom: 1px solid #2a2a4a; }
tr:hover { background: #1e1e3f; }
tr:last-child td { border-bottom: none; }
.critical { color: #ff4d4d; font-weight: bold; }
.high { color: #ff8c00; font-weight: bold; }
.medium { color: #ffd700; }
.low { color: #87ceeb; }
.info { color: #aaa; }
.evidence { font-family: 'Consolas', 'Monaco', monospace; font-size: 0.85em; color: #ccc; word-break: break-all; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
.badge-critical { background: #ff4d4d22; color: #ff4d4d; }
.badge-high { background: #ff8c0022; color: #ff8c00; }
.badge-medium { background: #ffd70022; color: #ffd700; }
.badge-low { background: #87ceeb22; color: #87ceeb; }
.badge-info { background: #aaa22; color: #aaa; }
.stats { display: flex; gap: 2em; margin: 1em 0; }
.stat { background: #1a1a2e; padding: 1em 2em; border-radius: 8px; }
.stat-value { font-size: 2em; font-weight: bold; color: #00d4ff; }
.stat-label { color: #aaa; font-size: 0.9em; }
.chart-container { background: #1a1a2e; border-radius: 8px; padding: 1em; margin: 1em 0; }
.chart-row { display: flex; gap: 2em; flex-wrap: wrap; }
.chart-col { flex: 1; min-width: 280px; max-width: 400px; }
canvas { max-width: 100%; max-height: 250px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<h1>🔍 gosleek 扫描报告</h1>
<p>生成时间: 2026-08-13 17:18:42</p>
<div class="stats">
<div class="stat"><div class="stat-value">1</div><div class="stat-label">总漏洞数</div></div>
<div class="stat"><div class="stat-value" style="color: #ff4d4d;">1</div><div class="stat-label">CRITICAL</div></div>
</div>
<div class="chart-row">
<div class="chart-col chart-container">
<h2 style="margin-top:0">严重度分布</h2>
<canvas id="sevChart" width="300" height="250"></canvas>
<script>
new Chart(document.getElementById('sevChart'), {
  type: 'doughnut',
  data: {
    labels: ['Critical', 'High', 'Medium', 'Low', 'Info'],
    datasets: [{
      data: [1, 0, 0, 0, 0],
      backgroundColor: ['#ff4d4d', '#ff8c00', '#ffd700', '#87ceeb', '#aaa'],
      borderColor: '#1a1a2e', borderWidth: 2
    }]
  },
  options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: '#e0e0e0' } } } }
});
</script>
</div>
<div class="chart-col chart-container">
<h2 style="margin-top:0">目标漏洞分布</h2>
<canvas id="targetChart" width="300" height="250"></canvas>
<script>
new Chart(document.getElementById('targetChart'), {
  type: 'bar',
  data: {
    labels: ["http://192.168.80.128:8080/"],
    datasets: [{
      label: '漏洞数',
      data: [1],
      backgroundColor: '#00d4ff',
      borderColor: '#00d4ff', borderWidth: 1
    }]
  },
  options: {
    scales: {
      x: { ticks: { color: '#aaa', maxRotation: 45, minRotation: 15 }, grid: { color: '#2a2a4a' } },
      y: { ticks: { color: '#aaa' }, grid: { color: '#2a2a4a' } }
    }
  }
});
</script>
</div>
</div>
<h2>漏洞详情</h2>

<td>CVE-2022-22947-go</td>
<td>Spring Cloud Gateway Actuator SpEL RCE</td>
<td>http://192.168.80.128:8080/</td>
<td class="evidence">SpEL 回显 marker &#34;QAXNB12138&#34; (status=200) (在响应体中检出)</td>
</tr>
</table>
</body>
</html>
